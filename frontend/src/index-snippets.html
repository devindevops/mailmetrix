<!-- Add these sections inside your existing tab container; wire the tab buttons in features/tabs.js like your other tabs. -->

<section id="tab-blacklist">
  <h2>Blacklist checker</h2>
  <form id="bl-form">
    <input id="bl-target" placeholder="IPv4 address or domain" required maxlength="253" />
    <button type="submit">Check</button>
  </form>
  <div id="bl-result"></div>
</section>

<section id="tab-score">
  <h2>Deliverability score</h2>
  <form id="score-form">
    <input id="score-domain" placeholder="example.com" required maxlength="253" />
    <input id="score-selector" placeholder="DKIM selector (optional)" maxlength="63" />
    <button type="submit">Score domain</button>
  </form>
  <div id="score-result"></div>
</section>

<section id="tab-tls">
  <h2>TLS certificate inspector</h2>
  <form id="tls-form">
    <input id="tls-host" placeholder="mail.example.com" required maxlength="253" />
    <select id="tls-port">
      <option value="25">25 (SMTP STARTTLS)</option>
      <option value="587">587 (Submission STARTTLS)</option>
      <option value="465">465 (SMTPS)</option>
      <option value="2525">2525 (STARTTLS)</option>
      <option value="993">993 (IMAPS)</option>
      <option value="995">995 (POP3S)</option>
      <option value="443">443 (HTTPS)</option>
    </select>
    <label><input type="checkbox" id="tls-versions" /> Probe TLS versions</label>
    <button type="submit">Inspect</button>
  </form>
  <div id="tls-result"></div>
</section>

<!-- Target for shared links (?share=ID). Put it near the top of <main>. -->
<div id="shared-result"></div>
