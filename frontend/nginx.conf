server {
    # 8080: the unprivileged image runs as a non-root user and cannot bind <1024.
    listen 8080;
    server_name _;

    # SEC-05: hide the Nginx version in the Server header and on error pages.
    server_tokens off;

    # SEC-05: defense-in-depth security headers.
    # "always" makes them apply to 4xx/5xx responses as well.
    #
    # IMPORTANT: Nginx only inherits add_header into a location block if that
    # location defines NO add_header of its own. If you ever add caching or CORS
    # headers inside a location, repeat this whole set there (or move it to a
    # file and `include` it in both places), otherwise these headers silently
    # disappear for that location.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy root health check directly to the backend service
    location /health {
        proxy_pass http://backend:4000/health;
        proxy_http_version 1.1;

        # Don't leak the backend framework ("X-Powered-By: Express").
        proxy_hide_header X-Powered-By;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # SEC-06: never expose internal telemetry through the proxy. The backend's
    # /internal/health is for in-network monitoring only. "^~" makes this
    # prefix win over the general /api/ location below.
    location ^~ /api/internal/ {
        return 404;
    }

    # Proxy API routes to the backend service
    location /api/ {
        # Optional perimeter authentication (see SEC-04). Protects the whole
        # backend, since nginx is its only entry point:
        # auth_basic           "MailMetrix";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://backend:4000/;

        proxy_http_version 1.1;

        # Don't leak the backend framework ("X-Powered-By: Express").
        proxy_hide_header X-Powered-By;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}