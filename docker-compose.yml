name: MailMetrix

services:
  backend:
    build:
      context: ./backend
    container_name: MailMetrix-backend
    env_file:
      - .env

    environment:
      PORT: ${PORT:-4000}
      NODE_ENV: production

    expose:
      - "${PORT:-4000}"

    init: true
    restart: unless-stopped
    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/health')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - mailmetrix-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/src
          ignore:
            - node_modules/

        - action: rebuild
          path: ./backend/package.json

  frontend:
    build:
      context: ./frontend
    container_name: MailMetrix-frontend
    env_file:
      - .env
    environment:
      BACKEND_PORT: ${PORT:-4000}
      NGINX_ENVSUBST_FILTER: "^BACKEND_PORT$"

    ports:
      - "50000:80"

    depends_on:
      backend:
        condition: service_healthy

    init: true
    restart: unless-stopped
    stop_grace_period: 15s

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/ || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - mailmetrix-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /usr/share/nginx/html

        - action: rebuild
          path: ./frontend/package.json

networks:
  mailmetrix-network:
    driver: bridge