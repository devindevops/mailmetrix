name: mailmetrix

services:
  backend:
    build:
      context: ./backend
    container_name: mailmetrix-backend
    env_file:
      - .env

    environment:
      PORT: ${PORT:-4000}
      NODE_ENV: production
      TRUST_PROXY: 1            # set to 2 if another proxy sits in front of port 50000
      SHARE_DIR: /app/data/shares
      SHARE_TTL_DAYS: ${SHARE_TTL_DAYS:-7}

    volumes:
      - mailmetrix-data:/app/data

    expose:
      - "${PORT:-4000}"

    init: true
    restart: unless-stopped
    stop_grace_period: 30s

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:${PORT:-4000}/health || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/src
          ignore:
            - node_modules/

        - action: rebuild
          path: ./backend/package.json

  frontend:
    build:
      context: ./frontend
    container_name: mailmetrix-frontend
    env_file:
      - .env
    environment:
      BACKEND_PORT: ${PORT:-4000}
      NGINX_ENVSUBST_FILTER: "^BACKEND_PORT$"

    ports:
      - "50000:8080"

    depends_on:
      backend:
        condition: service_healthy

    init: true
    restart: unless-stopped
    stop_grace_period: 15s

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8080/ || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /usr/share/nginx/html

        - action: rebuild
          path: ./frontend/package.json

networks:
  network:
    driver: bridge

volumes:
  mailmetrix-data:
