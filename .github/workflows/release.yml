name: MailMetrix Release Validation

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: mailmetrix-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release commit belongs to main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          release_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"

          if ! git merge-base --is-ancestor \
            "$release_commit" origin/main; then
            echo "::error::Release tag does not point to a commit contained in main."
            exit 1
          fi

          echo "Release commit is contained in main."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Create local environment configuration
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build release containers
        run: docker compose build --pull